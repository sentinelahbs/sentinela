# Sobe o backend + Postgres juntos, num ambiente parecido com produção,
# para testar antes de publicar de verdade. Não inclui o storage de
# clipes (S3/R2) nem o envio de email — esses continuam apontando para
# o provedor real configurado no .env, mesmo rodando local.

version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lossprevention
    volumes:
      - db_data:/var/lib/postgresql/data
      # Roda só na primeira vez, num volume vazio: cria a role sem
      # superuser que a API usa (ver docker/init-db.sql — precisa bater
      # com produção pro RLS das migrações ter efeito também aqui).
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Role dedicada, sem superuser — ver docker/init-db.sql. Se o seu
      # volume local já existia antes dessa mudança, rode:
      # docker compose down -v && docker compose up --build
      # (ou crie a role manualmente num banco que queira preservar).
      DATABASE_URL: postgresql://vigia_app:vigia_app_local_pw@db:5432/lossprevention
    ports:
      # Só no loopback do host: um proxy reverso no mesmo host/rede
      # Docker ainda alcança a API, mas nada fora do host consegue --
      # isso é exigido pela lógica de confiança no X-Forwarded-For em
      # app/rate_limit.py (senão qualquer um de fora forjaria o header).
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
