# Sobe o backend + Postgres juntos, num ambiente parecido com produção,
# para testar antes de publicar de verdade. Não inclui o storage de
# clipes (S3/R2) nem o envio de email — esses continuam apontando para
# o provedor real configurado no .env, mesmo rodando local.

version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lossprevention
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lossprevention
    ports:
      - "8000:8000"

volumes:
  db_data:
